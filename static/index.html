<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦍 GORILLAS — Web Edition</title>

  <!-- Retro pixel + modern display fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════
       DESIGN SYSTEM  — Retro-futuristic neon
    ══════════════════════════════════════════ */
    :root {
      --bg:         #05050f;
      --bg2:        #0a0a1e;
      --panel:      #0e0e2a;
      --border:     #1a1a4a;
      --neon-y:     #ffe600;
      --neon-g:     #00ff9d;
      --neon-b:     #00c8ff;
      --neon-r:     #ff3c5a;
      --neon-o:     #ff8c00;
      --text:       #e0e8ff;
      --text-dim:   #5a6a9a;
      --p1:         #00c8ff;
      --p2:         #ff3c5a;
      --font-pixel: 'Press Start 2P', monospace;
      --font-hud:   'Orbitron', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-hud);
      overflow: hidden;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.15) 2px,
        rgba(0,0,0,.15) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* ─── LAYOUT ─── */
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      padding: 8px 12px;
      gap: 8px;
    }

    /* ─── TITLE BAR ─── */
    #titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 860px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    #title {
      font-family: var(--font-pixel);
      font-size: clamp(10px, 1.4vw, 15px);
      color: var(--neon-y);
      text-shadow: 0 0 12px var(--neon-y), 0 0 30px rgba(255,230,0,.3);
      letter-spacing: 3px;
    }
    #subtitle {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 2px;
    }

    /* ─── SCORE HUD ─── */
    #scorebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 860px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      gap: 8px;
    }
    .player-hud {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 140px;
    }
    .player-hud .name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .p1-color { color: var(--p1); text-shadow: 0 0 8px var(--p1); }
    .p2-color { color: var(--p2); text-shadow: 0 0 8px var(--p2); }
    .player-hud .score {
      font-family: var(--font-pixel);
      font-size: 18px;
    }
    #center-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    #turn-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #turn-display {
      font-size: 11px;
      font-weight: 700;
      transition: color .3s;
    }
    #round-label {
      font-size: 9px;
      color: var(--text-dim);
    }

    /* ─── MESSAGE TICKER ─── */
    #message-bar {
      width: 100%;
      max-width: 860px;
      height: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      overflow: hidden;
    }
    #message-text {
      font-size: 9px;
      color: var(--neon-y);
      font-family: var(--font-pixel);
      white-space: nowrap;
      animation: ticker 0s linear;
    }
    @keyframes flash {
      0%,100%{ opacity:1 } 50%{ opacity:0.2 }
    }

    /* ─── CANVAS WRAPPER ─── */
    #canvas-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 0 24px rgba(0,200,255,.08), 0 0 60px rgba(0,0,50,.6);
      overflow: hidden;
      flex-shrink: 0;
    }
    #gameCanvas {
      display: block;
    }

    /* ─── CONTROLS PANEL ─── */
    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 860px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
    }
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }
    .ctrl-group label {
      font-size: 8px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .ctrl-group .value-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-group input[type=range] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    .ctrl-group input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      cursor: pointer;
    }
    #angle-input::-webkit-slider-thumb  { background: var(--neon-y); box-shadow: 0 0 6px var(--neon-y); }
    #vel-input::-webkit-slider-thumb    { background: var(--neon-g); box-shadow: 0 0 6px var(--neon-g); }
    .val-display {
      font-family: var(--font-pixel);
      font-size: 11px;
      min-width: 38px;
      text-align: right;
    }
    #val-angle { color: var(--neon-y); }
    #val-vel   { color: var(--neon-g); }

    /* THROW BUTTON */
    #throw-btn {
      background: linear-gradient(135deg, var(--neon-r), #c00040);
      border: none;
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 10px;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      box-shadow: 0 0 12px var(--neon-r);
      transition: transform .1s, box-shadow .1s;
      white-space: nowrap;
      min-width: 90px;
    }
    #throw-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 20px var(--neon-r);
    }
    #throw-btn:active:not(:disabled) { transform: scale(.97); }
    #throw-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* NEW GAME / SETTINGS */
    #newgame-btn, #settings-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-hud);
      font-size: 9px;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: border-color .2s, color .2s;
    }
    #newgame-btn:hover, #settings-btn:hover {
      border-color: var(--neon-b);
      color: var(--neon-b);
    }

    /* ─── WIND INDICATOR ─── */
    #wind-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    #wind-label { font-size: 8px; color: var(--text-dim); letter-spacing: 1px; }
    #wind-bar {
      width: 80px; height: 8px;
      background: var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    #wind-fill {
      position: absolute;
      top: 0; height: 100%;
      border-radius: 4px;
      transition: all .4s;
    }
    #wind-val {
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--neon-o);
    }

    /* ─── SETUP MODAL ─── */
    #setup-modal, #overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
    }
    #overlay {
      background: rgba(0,0,10,.82);
      backdrop-filter: blur(4px);
    }
    #setup-modal {
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 501;
    }
    #setup-box {
      background: var(--panel);
      border: 1px solid var(--neon-b);
      border-radius: 10px;
      padding: 32px 40px;
      width: 380px;
      box-shadow: 0 0 40px rgba(0,200,255,.15);
    }
    #setup-box h2 {
      font-family: var(--font-pixel);
      font-size: 13px;
      color: var(--neon-y);
      text-align: center;
      margin-bottom: 24px;
      text-shadow: 0 0 10px var(--neon-y);
    }
    .setup-field {
      margin-bottom: 16px;
    }
    .setup-field label {
      display: block;
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .setup-field input[type=text], .setup-field input[type=number] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-hud);
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 4px;
      outline: none;
      transition: border-color .2s;
    }
    .setup-field input:focus {
      border-color: var(--neon-b);
      box-shadow: 0 0 8px rgba(0,200,255,.2);
    }
    .setup-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }
    #play-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--neon-g), #00a866);
      border: none;
      color: var(--bg);
      font-family: var(--font-pixel);
      font-size: 11px;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 0 16px var(--neon-g);
      transition: transform .1s;
    }
    #play-btn:hover { transform: scale(1.03); }
    #play-btn:active { transform: scale(.97); }

    /* ─── WIN SPLASH ─── */
    #win-splash {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,10,.7);
      z-index: 200;
      flex-direction: column;
      gap: 16px;
    }
    #win-splash.show { display: flex; }
    #win-title {
      font-family: var(--font-pixel);
      font-size: clamp(14px, 2.5vw, 22px);
      color: var(--neon-y);
      text-shadow: 0 0 20px var(--neon-y);
      animation: flash 0.6s infinite;
      text-align: center;
      padding: 0 10px;
    }
    #win-sub {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
    }
    #win-next-btn {
      background: var(--neon-y);
      border: none;
      color: var(--bg);
      font-family: var(--font-pixel);
      font-size: 10px;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* ─── TRAJECTORY GUIDE LINE ─── */
    #angle-guide { pointer-events: none; }

    /* Responsive: scale canvas */
    @media (max-height: 700px) {
      #title { font-size: 10px; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════
     SETUP MODAL
════════════════════════════════════ -->
<div id="overlay"></div>
<div id="setup-modal">
  <div id="setup-box">
    <h2>🦍 GORILLAS</h2>

    <div class="setup-field">
      <label>Jogador 1 (Esquerda)</label>
      <input type="text" id="p1-name" value="PLAYER 1" maxlength="16" />
    </div>
    <div class="setup-field">
      <label>Jogador 2 (Direita)</label>
      <input type="text" id="p2-name" value="PLAYER 2" maxlength="16" />

    <hr class="setup-divider" />

    <div class="setup-field">
      <label>Rodadas por partida (1–20)</label>
      <input type="number" id="rounds-input" value="5" min="1" max="20" />
    </div>
    <div class="setup-field">
      <label>Gravidade m/s² (1–30, Terra = 17)</label>
      <input type="number" id="gravity-input" value="17" min="1" max="30" />
    </div>

    <hr class="setup-divider" />

    <button id="play-btn">▶ JOGAR</button>
  </div>
</div>

<!-- ════════════════════════════════════
     MAIN APP
════════════════════════════════════ -->
<div id="app">

  <!-- Title -->
  <div id="titlebar">
    <div>
      <div id="title">🦍 GORILLAS</div>
      <div id="subtitle">WEB EDITION · BANANA WARFARE SIMULATOR</div>
    </div>
    <div style="display:flex;gap:8px">
      <button id="settings-btn">⚙ CONFIG</button>
      <button id="newgame-btn">↺ NOVA PARTIDA</button>

  </div>

  <!-- Score HUD -->
  <div id="scorebar">
    <div class="player-hud">
      <div class="name p1-color" id="hud-p1-name">PLAYER 1</div>
      <div class="score p1-color" id="hud-p1-score">0</div>
    </div>
    <div id="center-hud">
      <div id="turn-label">VEZ DE</div>
      <div id="turn-display">—</div>
      <div id="round-label">Rodada <span id="round-num">1</span></div>
    </div>
    <div class="player-hud" style="align-items:flex-end">
      <div class="name p2-color" id="hud-p2-name">PLAYER 2</div>

  <!-- Message ticker -->
  <div id="message-bar">

  <!-- Canvas -->
  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <!-- Win splash rendered inside canvas-wrap -->

  <!-- Controls -->
  <div id="controls">

  </div>

</div><!-- #app -->

<!-- ════════════════════════════════════
     JAVASCRIPT ENGINE
════════════════════════════════════ -->
<script>
"use strict";

/* ── Canvas context ── */
const canvas  = document.getElementById("gameCanvas");
const ctx     = canvas.getContext("2d");

/* ── State ── */
const state = {
  phase: "setup",      // setup | playing | animating | roundover | gameover
  buildings: [],
  gorillas: [],
  wind: 0,
  gravity: 17,
  scores: [0, 0],
  currentPlayer: 0,    // 0 or 1
  round: 1,
  totalRounds: 5,
  playerNames: ["PLAYER 1", "PLAYER 2"],
  trajectory: [],      // banana path points
  trjIdx: 0,           // animation index
  hitResult: null,
  hitX: 0, hitY: 0,
  bananaAngle: 0,
  explosion: null,
  sunMouth: "happy",   // happy | shocked
  lastAngle: [45, 135],
  lastVel: [80, 80],
};

/* ── DOM refs ── */
const angleSlider = document.getElementById("angle-input");
const velSlider   = document.getElementById("vel-input");
const valAngle    = document.getElementById("val-angle");
const valVel      = document.getElementById("val-vel");
const throwBtn    = document.getElementById("throw-btn");
const msgText     = document.getElementById("message-text");
const turnDisplay = document.getElementById("turn-display");
const roundNum    = document.getElementById("round-num");
const winSplash   = document.getElementById("win-splash");
const winTitle    = document.getElementById("win-title");
const winSub      = document.getElementById("win-sub");
const winNextBtn  = document.getElementById("win-next-btn");
const windFill    = document.getElementById("wind-fill");
const windVal     = document.getElementById("wind-val");

/* ─────────────────────────────────────────
   DRAWING HELPERS
───────────────────────────────────────── */
function clear() {
  // Night sky gradient
  const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grd.addColorStop(0, "#060618");
  grd.addColorStop(1, "#0a0a20");
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  const stars = [[50,30],[120,15],[200,45],[350,20],[480,35],[600,18],[720,40],
                  [780,25],[90,80],[280,70],[430,55],[560,75],[660,50],[750,65]];
  stars.forEach(([sx,sy]) => {
    ctx.beginPath();
    ctx.arc(sx, sy, 1, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawGround() {
  const gy = state.groundY || 480;
  ctx.fillStyle = "#1a1a3a";
  ctx.fillRect(0, gy, canvas.width, canvas.height - gy);
  ctx.strokeStyle = "#2a2a5a";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
}

function drawBuildings() {
  state.buildings.forEach(b => {
    // Building body
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    // Building edge highlight
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    // Windows
    b.windows.forEach(w => {
      if (w.lit) {
        ctx.fillStyle = "#ffe070";
        ctx.shadowColor = "#ffe070";
        ctx.shadowBlur = 4;
      } else {
        ctx.fillStyle = "#111126";
        ctx.shadowBlur = 0;
      }
      ctx.fillRect(w.x, w.y, w.w, w.h);
    });
    ctx.shadowBlur = 0;
  });
}

function drawSun(mood) {
  const sx = state.sunX || 400;
  const sy = state.sunY || 60;
  const r  = 22;

  ctx.shadowColor = "#ffe600";
  ctx.shadowBlur = 30;

  // Body
  ctx.fillStyle = "#ffe600";
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();

  // Rays
  ctx.strokeStyle = "#ffe600";
  ctx.lineWidth = 2;
  const rays = [0, 45, 90, 135, 180, 225, 270, 315];
  rays.forEach(deg => {
    const rad = deg * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(rad)*(r+4), sy + Math.sin(rad)*(r+4));
    ctx.lineTo(sx + Math.cos(rad)*(r+12), sy + Math.sin(rad)*(r+12));
    ctx.stroke();
  });
  ctx.shadowBlur = 0;

  // Face
  ctx.fillStyle = "#1a0a00";
  // Eyes
  ctx.beginPath(); ctx.arc(sx - 7, sy - 5, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + 7, sy - 5, 2.5, 0, Math.PI*2); ctx.fill();

  if (mood === "shocked") {
    // O mouth
    ctx.beginPath(); ctx.arc(sx, sy + 8, 4, 0, Math.PI*2); ctx.fill();
  } else {
    // Smile
    ctx.strokeStyle = "#1a0a00";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sy + 2, 10, 0.2, Math.PI - 0.2);
    ctx.stroke();
  }
}

function drawGorilla(gx, gy, armState, playerIdx) {
  // armState: 'down' | 'throwL' | 'throwR'
  const color = playerIdx === 0 ? "#7a5c3a" : "#5a3a2a";
  const hi    = playerIdx === 0 ? "#9a7a5a" : "#7a5a3a";

  ctx.fillStyle = color;

  // Body
  ctx.fillRect(gx + 4,  gy + 12, 22, 20);
  // Head
  ctx.fillRect(gx + 5,  gy,      20, 14);
  // Legs
  ctx.fillRect(gx + 4,  gy + 30, 9, 10);
  ctx.fillRect(gx + 17, gy + 30, 9, 10);

  // Arms
  ctx.fillStyle = hi;
  if (armState === "throwR") {
    // Left arm raised
    ctx.fillRect(gx - 8, gy + 0, 12, 6);
    ctx.fillRect(gx + 26, gy + 12, 10, 6);
  } else if (armState === "throwL") {
    // Right arm raised
    ctx.fillRect(gx - 8, gy + 12, 10, 6);
    ctx.fillRect(gx + 26, gy + 0, 12, 6);
  } else {
    // Both down
    ctx.fillRect(gx - 8, gy + 14, 12, 6);
    ctx.fillRect(gx + 26, gy + 14, 12, 6);
  }

  // Face
  ctx.fillStyle = "#1a0a00";
  ctx.fillRect(gx + 8,  gy + 3, 5, 2);  // left eye
  ctx.fillRect(gx + 17, gy + 3, 5, 2);  // right eye
  ctx.fillRect(gx + 9,  gy + 8, 12, 2); // mouth

  // Chest pattern
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  ctx.beginPath();
  ctx.arc(gx + 15, gy + 18, 7, 0, Math.PI*2); ctx.fill();

  // Neon outline glow
  ctx.strokeStyle = playerIdx === 0 ? "rgba(0,200,255,0.5)" : "rgba(255,60,90,0.5)";
  ctx.lineWidth = 1;
  ctx.shadowColor = playerIdx === 0 ? "#00c8ff" : "#ff3c5a";
  ctx.shadowBlur = 8;
  ctx.strokeRect(gx + 4, gy, 22, 40);
  ctx.shadowBlur = 0;
}

function drawBanana(bx, by, angle) {
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(angle);
  ctx.fillStyle = "#ffe600";
  ctx.shadowColor = "#ffe600";
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0.5, Math.PI - 0.5);
  ctx.arc(0, -2, 4, Math.PI + 0.3, -0.3, true);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawExplosion(ex, ey, progress) {
  // progress: 0→1→0 (expand then contract)
  const maxR = 40;
  const r = Math.sin(progress * Math.PI) * maxR;
  if (r <= 0) return;

  const layers = [
    { r: r * 1.2, color: "rgba(255,140,0,0.3)" },
    { r: r * 0.9, color: "rgba(255,60,0,0.5)" },
    { r: r * 0.6, color: "rgba(255,200,0,0.7)" },
    { r: r * 0.3, color: "rgba(255,255,200,0.9)" },
  ];

  layers.forEach(l => {
    ctx.beginPath();
    ctx.arc(ex, ey, l.r, 0, Math.PI*2);
    ctx.fillStyle = l.color;
    ctx.shadowColor = "#ff8c00";
    ctx.shadowBlur = 20;
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Sparks
  const sparks = 10;
  for (let i = 0; i < sparks; i++) {
    const a = (i / sparks) * Math.PI * 2;
    const sr = r * (0.8 + Math.random() * 0.5);
    ctx.fillStyle = `rgba(255,${180+Math.random()*75|0},0,${0.8 - progress*0.5})`;
    ctx.beginPath();
    ctx.arc(ex + Math.cos(a)*sr, ey + Math.sin(a)*sr, 2, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawWindIndicator() {
  const w = state.wind;
  const maxW = 20;
  const normalized = w / maxW;  // -1 to 1
  const barW = 80;

  if (w === 0) {
    windFill.style.width = "0";
    windFill.style.background = "#888";
  } else if (w > 0) {
    windFill.style.left = "50%";
    windFill.style.width = (Math.abs(normalized) * 50) + "%";
    windFill.style.background = "linear-gradient(90deg,#ff8c00,#ffe600)";
  } else {
    const pct = Math.abs(normalized) * 50;
    windFill.style.left = (50 - pct) + "%";
    windFill.style.width = pct + "%";
    windFill.style.background = "linear-gradient(90deg,#00c8ff,#00ff9d)";
  }
  const arrow = w > 0 ? "→" : w < 0 ? "←" : "—";
  windVal.textContent = `${arrow} ${Math.abs(w)}`;
}

function drawTrajectoryPreview() {
  const p = state.currentPlayer;
  const g = state.gorillas[p];
  if (!g) return;

  const angle = parseFloat(angleSlider.value);
  const vel   = parseFloat(velSlider.value) * 0.3;
  const rad   = (p === 0 ? angle : 180 - angle) * Math.PI / 180;

  ctx.setLineDash([4, 8]);
  ctx.strokeStyle = p === 0 ? "rgba(0,200,255,0.25)" : "rgba(255,60,90,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();

  const sx = g.x + 15 + (p === 0 ? 10 : -5);
  const sy = g.y + 5;
  let drawn = false;

  for (let t = 0; t < 4; t += 0.15) {
    const vx = Math.cos(rad) * vel;
    const vy = Math.sin(rad) * vel;
    const x  = sx + vx * t;
    const y  = sy - (vy * t - 0.5 * 9.8 * t * t);
    if (!drawn) { ctx.moveTo(x, y); drawn = true; }
    else ctx.lineTo(x, y);
    if (y > canvas.height || x < -20 || x > canvas.width + 20) break;
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function renderFrame() {
  clear();
  drawGround();
  drawBuildings();
  drawSun(state.sunMouth);

  // Gorillas
  state.gorillas.forEach((g, i) => {
    let arm = "down";
    if (state.phase === "animating" && i === state.currentPlayer) arm = "throwR";
    drawGorilla(g.x, g.y, arm, i);
  });

  // Trajectory preview (only when idle)
  if (state.phase === "playing") drawTrajectoryPreview();

  // Banana animation
  if (state.phase === "animating" && state.trajectory.length > 0) {
    const idx = Math.min(state.trjIdx, state.trajectory.length - 1);
    const pt  = state.trajectory[idx];
    state.bananaAngle += 0.3;
    drawBanana(pt.x, pt.y, state.bananaAngle);
  }

  // Explosion
  if (state.explosion) {
    drawExplosion(state.explosion.x, state.explosion.y, state.explosion.progress);
  }
}

/* ─────────────────────────────────────────
   ANIMATION LOOP
───────────────────────────────────────── */
let raf = null;
function startRenderLoop() {
  function loop() {
    renderFrame();

    if (state.phase === "animating") {
      state.trjIdx += 2;

      if (state.trjIdx >= state.trajectory.length) {
        // Animation done
        if (state.hitResult && state.hitResult.startsWith("gorilla")) {
          // Start explosion
          state.sunMouth = "shocked";
          state.explosion = { x: state.hitX, y: state.hitY, progress: 0 };
        } else {
          finishThrow(false);
        }
      }
    }

    if (state.explosion) {
      state.explosion.progress += 0.04;
      if (state.explosion.progress >= 1) {
        state.explosion = null;
        finishThrow(true);
      }
    }

    raf = requestAnimationFrame(loop);
  }
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

/* ─────────────────────────────────────────
   GAME LOGIC
───────────────────────────────────────── */
async function startNewGame() {
  const gravity = parseInt(document.getElementById("gravity-input").value) || 17;
  state.playerNames[0] = document.getElementById("p1-name").value.trim().toUpperCase() || "PLAYER 1";
  state.playerNames[1] = document.getElementById("p2-name").value.trim().toUpperCase() || "PLAYER 2";
  state.totalRounds = parseInt(document.getElementById("rounds-input").value) || 5;
  state.gravity = gravity;
  state.scores = [0, 0];
  state.round = 1;

  document.getElementById("hud-p1-name").textContent = state.playerNames[0];
  document.getElementById("hud-p2-name").textContent = state.playerNames[1];
  updateScoreHUD();

  await loadRound();
}

async function loadRound() {
  state.phase = "animating"; // block input during load
  throwBtn.disabled = true;

  const res = await fetch("/api/new_game", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ gravity: state.gravity }),
  });
  const data = await res.json();

  state.buildings      = data.buildings;
  state.gorillas       = data.gorillas;
  state.wind           = data.wind;
  state.gravity        = data.gravity;
  state.groundY        = data.ground_y;
  state.sunX           = data.sun.x;
  state.sunY           = data.sun.y;
  state.currentPlayer  = 0;
  state.trajectory     = [];
  state.trjIdx         = 0;
  state.hitResult      = null;
  state.explosion      = null;
  state.sunMouth       = "happy";

  // Restore last angles
  angleSlider.value = state.lastAngle[0];
  velSlider.value   = state.lastVel[0];
  syncSliders();
  drawWindIndicator();
  updateTurnHUD();
  roundNum.textContent = state.round;

  state.phase = "playing";
  throwBtn.disabled = false;
  showMessage(`🍌 Rodada ${state.round} — VEZ DE ${state.playerNames[state.currentPlayer]}!`);
}

async function doThrow() {
  if (state.phase !== "playing") return;
  state.phase = "animating";
  throwBtn.disabled = true;

  const p  = state.currentPlayer;
  const g  = state.gorillas[p];
  const angle = parseFloat(angleSlider.value);
  const vel   = parseFloat(velSlider.value);

  state.lastAngle[p] = angle;
  state.lastVel[p]   = vel;

  const res = await fetch("/api/throw", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      gorilla_x: g.x + 15,
      gorilla_y: g.y + 5,
      angle:     angle,
      velocity:  vel,
      player:    p + 1,
      buildings: state.buildings,
      gorillas:  state.gorillas,
      gravity:   state.gravity,
      wind:      state.wind,
    }),
  });
  const data = await res.json();

  state.trajectory = data.points;
  state.trjIdx     = 0;
  state.hitResult  = data.hit;
  state.hitX       = data.hit_x;
  state.hitY       = data.hit_y;
  state.bananaAngle = 0;

  if (data.message) showMessage(data.message);
}

function finishThrow(wasHit) {
  state.sunMouth = "happy";

  if (wasHit && state.hitResult && state.hitResult.startsWith("gorilla")) {
    // Determine who was hit
    const hitIdx = parseInt(state.hitResult.replace("gorilla", "")) - 1;
    const winner = hitIdx === state.currentPlayer ? state.currentPlayer : state.currentPlayer;
    // If hit self, other player scores; else current player scores
    const scorer = (hitIdx === state.currentPlayer) ? (1 - state.currentPlayer) : state.currentPlayer;
    state.scores[scorer]++;
    updateScoreHUD();

    if (state.scores[scorer] >= Math.ceil(state.totalRounds / 2) + 1 || 
        state.round >= state.totalRounds) {
      // Game over
      showWinSplash(scorer);
      state.phase = "gameover";
      return;
    }

    // Round over
    state.round++;
    showWinSplash(scorer, true);
    state.phase = "roundover";
  } else {
    // Miss — switch turn
    state.currentPlayer = 1 - state.currentPlayer;
    updateTurnHUD();
    // Restore previous inputs for new player
    angleSlider.value = state.lastAngle[state.currentPlayer];
    velSlider.value   = state.lastVel[state.currentPlayer];
    syncSliders();
    state.phase = "playing";
    throwBtn.disabled = false;
    showMessage(`🎯 ${state.playerNames[state.currentPlayer]}, é sua vez!`);
  }
}

function showWinSplash(winner, roundOnly = false) {
  const name = state.playerNames[winner];
  if (roundOnly) {
    winTitle.textContent = `🎉 ${name} VENCEU A RODADA!`;
    winSub.textContent   = `Placar: ${state.scores[0]} × ${state.scores[1]} — Clique para continuar`;
    winNextBtn.textContent = "PRÓXIMA RODADA ▶";
  } else {
    winTitle.textContent = `🏆 ${name} CAMPEÃO!`;
    winSub.textContent   = `Placar final: ${state.scores[0]} × ${state.scores[1]}`;
    winNextBtn.textContent = "NOVA PARTIDA ▶";
  }
  winSplash.classList.add("show");
}

winNextBtn.addEventListener("click", () => {
  winSplash.classList.remove("show");
  if (state.phase === "gameover") {
    openSetup();
  } else {
    loadRound();
  }
});

function updateScoreHUD() {
  document.getElementById("hud-p1-score").textContent = state.scores[0];
  document.getElementById("hud-p2-score").textContent = state.scores[1];
}

function updateTurnHUD() {
  const p = state.currentPlayer;
  turnDisplay.textContent = state.playerNames[p];
  turnDisplay.style.color = p === 0 ? "var(--p1)" : "var(--p2)";
}

function showMessage(txt) {
  msgText.textContent = txt;
}

function syncSliders() {
  valAngle.textContent = angleSlider.value + "°";
  valVel.textContent   = velSlider.value;
}

/* ─────────────────────────────────────────
   SETUP MODAL
───────────────────────────────────────── */
function openSetup() {
  document.getElementById("setup-modal").style.display = "flex";
  document.getElementById("overlay").style.display = "block";
}
function closeSetup() {
  document.getElementById("setup-modal").style.display = "none";
  document.getElementById("overlay").style.display = "none";
}

document.getElementById("play-btn").addEventListener("click", async () => {
  closeSetup();
  await startNewGame();
});

document.getElementById("settings-btn").addEventListener("click", openSetup);
document.getElementById("newgame-btn").addEventListener("click", async () => {
  winSplash.classList.remove("show");
  await startNewGame();
});

/* ─────────────────────────────────────────
   SLIDER EVENTS
───────────────────────────────────────── */
angleSlider.addEventListener("input", () => {
  valAngle.textContent = angleSlider.value + "°";
});
velSlider.addEventListener("input", () => {
  valVel.textContent = velSlider.value;
});

/* ─────────────────────────────────────────
   THROW
───────────────────────────────────────── */
throwBtn.addEventListener("click", doThrow);

/* Keyboard shortcut: Enter = throw */
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && state.phase === "playing") doThrow();
  if (e.key === "ArrowLeft")  { angleSlider.value = +angleSlider.value - 1; syncSliders(); }
  if (e.key === "ArrowRight") { angleSlider.value = +angleSlider.value + 1; syncSliders(); }
  if (e.key === "ArrowUp")    { velSlider.value   = +velSlider.value   + 1; syncSliders(); }
  if (e.key === "ArrowDown")  { velSlider.value   = +velSlider.value   - 1; syncSliders(); }
});

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
startRenderLoop();
syncSliders();
</script>
