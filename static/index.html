<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦍 GORILLAS — Web Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#05050f; --bg2:#0a0a1e; --panel:#0e0e2a; --border:#1a1a4a;
      --neon-y:#ffe600; --neon-g:#00ff9d; --neon-b:#00c8ff;
      --neon-r:#ff3c5a; --neon-o:#ff8c00;
      --text:#e0e8ff; --text-dim:#5a6a9a;
      --p1:#00c8ff; --p2:#ff3c5a;
      --fp:'Press Start 2P',monospace; --fh:'Orbitron',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--fh);overflow:hidden}
    body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px);pointer-events:none;z-index:1000}
    @keyframes flash{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes pulse{0%,100%{box-shadow:0 0 8px var(--neon-r)}50%{box-shadow:0 0 22px var(--neon-r)}}

    /* ── LAYOUT ── */
    #app{display:flex;flex-direction:column;align-items:center;height:100vh;padding:7px 12px;gap:5px}
    #titlebar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:860px;border-bottom:1px solid var(--border);padding-bottom:5px}
    #title{font-family:var(--fp);font-size:clamp(9px,1.3vw,13px);color:var(--neon-y);text-shadow:0 0 12px var(--neon-y),0 0 30px rgba(255,230,0,.3);letter-spacing:3px}
    #subtitle{font-size:7px;color:var(--text-dim);letter-spacing:2px}
    .hdr-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:var(--fh);font-size:8px;padding:5px 9px;border-radius:4px;cursor:pointer;letter-spacing:1px;transition:border-color .2s,color .2s}
    .hdr-btn:hover{border-color:var(--neon-b);color:var(--neon-b)}

    /* ── SCOREBAR ── */
    #scorebar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:860px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 14px;gap:8px}
    .phud{display:flex;flex-direction:column;gap:2px;min-width:120px}
    .phud .name{font-size:10px;font-weight:700;letter-spacing:1px}
    .p1c{color:var(--p1);text-shadow:0 0 8px var(--p1)}.p2c{color:var(--p2);text-shadow:0 0 8px var(--p2)}
    .phud .sc{font-family:var(--fp);font-size:16px}
    #chud{display:flex;flex-direction:column;align-items:center;gap:2px}
    #tlbl{font-size:7px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase}
    #tdisp{font-size:10px;font-weight:700;transition:color .3s}
    #rlbl{font-size:8px;color:var(--text-dim)}

    /* ── MESSAGE BAR ── */
    #msgbar{width:100%;max-width:860px;height:22px;background:var(--panel);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;padding:0 12px;overflow:hidden}
    #msgtxt{font-size:8px;color:var(--neon-y);font-family:var(--fp);white-space:nowrap;transition:opacity .2s}

    /* ── CANVAS ── */
    #cwrap{position:relative;border:1px solid var(--border);border-radius:6px;box-shadow:0 0 24px rgba(0,200,255,.08),0 0 60px rgba(0,0,50,.6);overflow:hidden;flex-shrink:0}
    #gc{display:block}

    /* ── CONTROLS ── */
    #controls{display:flex;align-items:center;gap:10px;width:100%;max-width:860px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px}
    #jwrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
    #jlbl{font-size:7px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
    #jc{cursor:crosshair;border-radius:50%}
    #aimstats{display:flex;flex-direction:column;gap:5px;flex:1;min-width:90px}
    .srow{display:flex;flex-direction:column;gap:1px}
    .slbl{font-size:7px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
    .sval{font-family:var(--fp);font-size:12px}
    #dangle{color:var(--neon-y)} #dvel{color:var(--neon-g)}
    #wwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
    #wlbl{font-size:7px;color:var(--text-dim);letter-spacing:1px}
    #wbar{width:70px;height:7px;background:var(--border);border-radius:4px;position:relative;overflow:hidden}
    #wfill{position:absolute;top:0;height:100%;border-radius:4px;transition:all .4s}
    #wval{font-family:var(--fp);font-size:8px;color:var(--neon-o)}
    #throwbtn{background:linear-gradient(135deg,var(--neon-r),#c00040);border:none;color:#fff;font-family:var(--fp);font-size:9px;padding:10px 16px;border-radius:5px;cursor:pointer;letter-spacing:1px;box-shadow:0 0 12px var(--neon-r);transition:transform .1s,box-shadow .1s;white-space:nowrap;min-width:78px}
    #throwbtn:hover:not(:disabled){transform:scale(1.05);box-shadow:0 0 20px var(--neon-r)}
    #throwbtn:active:not(:disabled){transform:scale(.97)}
    #throwbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

    /* ── SETUP MODAL ── */
    #overlay,#setupmodal{position:fixed;inset:0;z-index:500}
    #overlay{background:rgba(0,0,10,.88);backdrop-filter:blur(4px)}
    #setupmodal{display:flex;align-items:center;justify-content:center;z-index:501}
    #setupbox{background:var(--panel);border:1px solid var(--neon-b);border-radius:10px;padding:26px 34px;width:440px;box-shadow:0 0 40px rgba(0,200,255,.15);max-height:90vh;overflow-y:auto}
    #setupbox h2{font-family:var(--fp);font-size:12px;color:var(--neon-y);text-align:center;margin-bottom:20px;text-shadow:0 0 10px var(--neon-y)}
    .sf{margin-bottom:12px}
    .sf label{display:block;font-size:8px;color:var(--text-dim);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
    .sf input[type=text],.sf input[type=number],.sf select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--fh);font-size:13px;padding:7px 10px;border-radius:4px;outline:none;transition:border-color .2s}
    .sf input:focus,.sf select:focus{border-color:var(--neon-b);box-shadow:0 0 8px rgba(0,200,255,.2)}
    .sdiv{border:none;border-top:1px solid var(--border);margin:12px 0}
    /* Sprite section label */
    .sec-lbl{font-size:8px;color:var(--text-dim);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
    /* Sprite grid */
    .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
    .sslot{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border:1px dashed var(--border);border-radius:6px;padding:7px 4px;cursor:pointer;transition:border-color .2s}
    .sslot:hover{border-color:var(--neon-b)}
    .sslot img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
    .sslot span{font-size:6px;color:var(--text-dim);text-align:center;letter-spacing:.5px;line-height:1.4}
    .sslot input[type=file]{display:none}
    /* BG slot */
    .bgslot{width:100%;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px dashed var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;transition:border-color .2s;margin-bottom:12px}
    .bgslot:hover{border-color:var(--neon-g)}
    .bgslot img{width:48px;height:28px;object-fit:cover;border-radius:3px}
    .bgslot span{font-size:7px;color:var(--text-dim);letter-spacing:1px;flex:1}
    .bgslot input[type=file]{display:none}
    #playbtn{width:100%;background:linear-gradient(135deg,var(--neon-g),#00a866);border:none;color:var(--bg);font-family:var(--fp);font-size:10px;padding:12px;border-radius:6px;cursor:pointer;letter-spacing:2px;box-shadow:0 0 16px var(--neon-g);transition:transform .1s}
    #playbtn:hover{transform:scale(1.03)} #playbtn:active{transform:scale(.97)}

    /* ── WIN SPLASH ── */
    #winsplash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,10,.72);z-index:200;flex-direction:column;gap:14px}
    #winsplash.show{display:flex}
    #wintitle{font-family:var(--fp);font-size:clamp(12px,2.2vw,20px);color:var(--neon-y);text-shadow:0 0 20px var(--neon-y);animation:flash .6s infinite;text-align:center;padding:0 10px}
    #winsub{font-size:10px;color:var(--text-dim);letter-spacing:2px}
    #winnextbtn{background:var(--neon-y);border:none;color:var(--bg);font-family:var(--fp);font-size:9px;padding:10px 20px;border-radius:4px;cursor:pointer}

    /* ── AI BUBBLE ── */
    #aibubble{display:none;position:absolute;top:12px;right:12px;background:rgba(10,10,30,.92);border:1px solid var(--neon-r);border-radius:8px;padding:8px 14px;font-family:var(--fp);font-size:8px;color:var(--neon-r);max-width:220px;z-index:100;line-height:1.6;animation:pulse 1s infinite}
  </style>
</head>
<body>

<!-- SETUP MODAL -->
<div id="overlay"></div>
<div id="setupmodal">
  <div id="setupbox">
    <h2>🦍 GORILLAS</h2>

    <div class="sf">
      <label>Seu Nome</label>
      <input type="text" id="p1name" value="PLAYER" maxlength="16" />
    </div>
    <div class="sf">
      <label>Dificuldade da IA</label>
      <select id="aiDiff">
        <option value="easy">Fácil — erra muito</option>
        <option value="medium" selected>Médio — erra um pouco</option>
        <option value="hard">Difícil — mira certeira</option>

    </div>

    <hr class="sdiv" />

    <div class="sf">

    </div>
    <div class="sf">
      <label>Gravidade (1–30)</label>

    </div>

    <hr class="sdiv" />

    <!-- SPRITES -->
    <div class="sec-lbl">Sprites dos Gorilas (opcional)</div>
    <div class="sgrid">
      <label class="sslot">
        <img id="pv-idle1" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Crect x='4' y='12' width='22' height='20' fill='%237a5c3a'/%3E%3Crect x='5' y='0' width='20' height='14' fill='%237a5c3a'/%3E%3Crect x='4' y='30' width='9' height='10' fill='%237a5c3a'/%3E%3Crect x='17' y='30' width='9' height='10' fill='%237a5c3a'/%3E%3C/svg%3E" />
        <span>P1<br>PARADO</span>
        <input type="file" id="f-idle1" accept="image/*" />
      </label>
      <label class="sslot">
        <img id="pv-ready1" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Crect x='4' y='12' width='22' height='20' fill='%237a5c3a'/%3E%3Crect x='5' y='0' width='20' height='14' fill='%237a5c3a'/%3E%3Crect x='-4' y='2' width='12' height='6' fill='%239a7a5a'/%3E%3Crect x='17' y='30' width='9' height='10' fill='%237a5c3a'/%3E%3C/svg%3E" />
        <span>P1<br>PRONTO</span>
        <input type="file" id="f-ready1" accept="image/*" />
      </label>
      <label class="sslot">
        <img id="pv-throw1" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Crect x='4' y='12' width='22' height='20' fill='%237a5c3a'/%3E%3Crect x='5' y='0' width='20' height='14' fill='%237a5c3a'/%3E%3Crect x='-8' y='0' width='12' height='6' fill='%239a7a5a'/%3E%3C/svg%3E" />
        <span>P1<br>ARREMESSO</span>
        <input type="file" id="f-throw1" accept="image/*" />
      </label>
      <label class="sslot">
        <img id="pv-dead1" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 20'%3E%3Crect x='0' y='6' width='40' height='14' fill='%237a5c3a'/%3E%3Crect x='4' y='0' width='14' height='10' fill='%237a5c3a'/%3E%3C/svg%3E" />
        <span>P1<br>DERROTADO</span>
        <input type="file" id="f-dead1" accept="image/*" />
      </label>
      <label class="sslot">
        <img id="pv-idle2" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Crect x='4' y='12' width='22' height='20' fill='%235a3a2a'/%3E%3Crect x='5' y='0' width='20' height='14' fill='%235a3a2a'/%3E%3Crect x='4' y='30' width='9' height='10' fill='%235a3a2a'/%3E%3Crect x='17' y='30' width='9' height='10' fill='%235a3a2a'/%3E%3C/svg%3E" />
        <span>IA<br>PARADO</span>
        <input type="file" id="f-idle2" accept="image/*" />
      </label>
      <label class="sslot">
        <img id="pv-throw2" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Crect x='4' y='12' width='22' height='20' fill='%235a3a2a'/%3E%3Crect x='5' y='0' width='20' height='14' fill='%235a3a2a'/%3E%3Crect x='26' y='0' width='12' height='6' fill='%237a5a3a'/%3E%3C/svg%3E" />
        <span>IA<br>ARREMESSO</span>

    <!-- Banana + BG -->

        <span>EXPLOSÃO</span>
        <input type="file" id="f-exp" accept="image/*" />
      </label>
    </div>

    <label class="bgslot">
      <img id="pv-bg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 28'%3E%3Crect width='48' height='28' fill='%230a0a20'/%3E%3Ccircle cx='24' cy='8' r='5' fill='%23ffe600'/%3E%3C/svg%3E" />
      <span>🖼 PLANO DE FUNDO — clique para carregar</span>
      <input type="file" id="f-bg" accept="image/*" />
    </label>

    <button id="playbtn">▶ JOGAR vs IA</button>

</div>

<!-- APP -->
<div id="app">
  <div id="titlebar">
    <div>
      <div id="title">🦍 GORILLAS</div>
      <div id="subtitle">WEB EDITION · VOCÊ vs 🤖 GROQ</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="hdr-btn" id="settingsbtn">⚙ CONFIG</button>
      <button class="hdr-btn" id="newgamebtn">↺ NOVA PARTIDA</button>
    </div>
  </div>

  <div id="scorebar">
    <div class="phud">
      <div class="name p1c" id="hup1">PLAYER</div>
      <div class="sc p1c"   id="sc1">0</div>
    </div>
    <div id="chud">
      <div id="tlbl">VEZ DE</div>
      <div id="tdisp">—</div>
      <div id="rlbl">Rodada <span id="rnum">1</span></div>
    </div>

      <div class="sc p2c"   id="sc2">0</div>

  </div>

  <div id="msgbar"><span id="msgtxt">🍌 Configure e clique em JOGAR vs IA!</span></div>

  <div id="cwrap">
    <canvas id="gc" width="800" height="500"></canvas>
    <div id="winsplash">
      <div id="wintitle">🎉 VITÓRIA!</div>
      <div id="winsub"></div>

    </div>

  </div>

  <div id="controls">
    <div id="jwrap">
      <div id="jlbl">MIRA</div>
      <canvas id="jc" width="90" height="90"></canvas>
    </div>

      <div class="srow"><span class="slbl">Ângulo</span><span class="sval" id="dangle">45°</span></div>
      <div class="srow"><span class="slbl">Velocidade</span><span class="sval" id="dvel">80</span></div>
    </div>
    <div id="wwrap">
      <div id="wlbl">VENTO</div>
      <div id="wbar"><div id="wfill"></div></div>
      <div id="wval">0</div>
    </div>
    <button id="throwbtn" disabled>🍌 LANÇAR</button>

<script>
"use strict";

/* ════════════════════════════════
   SPRITES
   Pasta: static/assets/
   Arquivos esperados (se não fizer upload):
     gorilla_idle.png, gorilla_ready.png, gorilla_throw.png, gorilla_defeated.png
     gorilla2_idle.png, gorilla2_throw.png
     banana.png, background.png
════════════════════════════════ */
const BASE = "/static/assets/";

function mkImg(src) {
  const img = new Image();
  img.src = src;
  return img;
}

// Tentativa de carregar sprites da pasta assets
const SP = {
  idle1:    mkImg(BASE + "gorilla_idle.png"),
  ready1:   mkImg(BASE + "gorilla_ready.png"),
  throw1:   mkImg(BASE + "gorilla_throw.png"),
  dead1:    mkImg(BASE + "gorilla_defeated.png"),
  idle2:    mkImg(BASE + "gorilla2_idle.png"),
  throw2:   mkImg(BASE + "gorilla2_throw.png"),
  banana:   mkImg(BASE + "banana.png"),
  exp:      null,
  bg:       mkImg(BASE + "background.png"),
};

// Se carregar via upload no setup, substitui
function bindUpload(inputId, key, previewId) {
  document.getElementById(inputId).addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { SP[key] = img; document.getElementById(previewId).src = url; };
    img.src = url;
  });
}
bindUpload("f-idle1",  "idle1",  "pv-idle1");
bindUpload("f-ready1", "ready1", "pv-ready1");
bindUpload("f-throw1", "throw1", "pv-throw1");
bindUpload("f-dead1",  "dead1",  "pv-dead1");
bindUpload("f-idle2",  "idle2",  "pv-idle2");
bindUpload("f-throw2", "throw2", "pv-throw2");
bindUpload("f-banana", "banana", "pv-banana");
bindUpload("f-exp",    "exp",    "pv-exp");
bindUpload("f-bg",     "bg",     "pv-bg");

function imgReady(img) {
  return img && img.complete && img.naturalWidth > 0;
}

/* ════════════════════════════════
   CANVAS / CTX
════════════════════════════════ */
const canvas = document.getElementById("gc");
const ctx    = canvas.getContext("2d");

/* ════════════════════════════════
   JOYSTICK
════════════════════════════════ */
const jcan = document.getElementById("jc");
const jctx = jcan.getContext("2d");
const JR = 45, KR = 13;

const joy = { active:false, dx:0, dy:0, angle:45, power:80 };

function drawJoy() {
  jctx.clearRect(0,0,jcan.width,jcan.height);
  const cx = JR, cy = JR;
  const kx = cx + joy.dx*(JR-KR-4);
  const ky = cy + joy.dy*(JR-KR-4);

  // Outer ring
  jctx.beginPath(); jctx.arc(cx,cy,JR-2,0,Math.PI*2);
  jctx.strokeStyle="rgba(0,200,255,.22)"; jctx.lineWidth=2; jctx.stroke();

  // Crosshair
  jctx.strokeStyle="rgba(255,255,255,.07)"; jctx.lineWidth=1;
  jctx.setLineDash([3,4]);
  jctx.beginPath(); jctx.moveTo(cx-JR+4,cy); jctx.lineTo(cx+JR-4,cy); jctx.stroke();
  jctx.beginPath(); jctx.moveTo(cx,cy-JR+4); jctx.lineTo(cx,cy+JR-4); jctx.stroke();
  jctx.setLineDash([]);

  // Line
  jctx.strokeStyle="rgba(0,200,255,.45)"; jctx.lineWidth=2;
  jctx.beginPath(); jctx.moveTo(cx,cy); jctx.lineTo(kx,ky); jctx.stroke();

  // Knob
  const g = jctx.createRadialGradient(kx,ky,2,kx,ky,KR);
  g.addColorStop(0,"#00eeff"); g.addColorStop(1,"#004888");
  jctx.beginPath(); jctx.arc(kx,ky,KR,0,Math.PI*2);
  jctx.fillStyle=g;
  jctx.shadowColor="#00c8ff"; jctx.shadowBlur=joy.active?16:6;
  jctx.fill(); jctx.shadowBlur=0;
}

function jPos(e) {
  const r = jcan.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}

function updateJoy(x,y) {
  let dx=(x-JR)/(JR-KR-4), dy=(y-JR)/(JR-KR-4);
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d>1){dx/=d;dy/=d;}
  joy.dx=dx; joy.dy=dy;

  let ang = Math.atan2(-dy,dx)*180/Math.PI;
  ang = ((ang%360)+360)%360;
  if(ang>180&&ang<360) ang = ang>270 ? 360-ang : 180;

  joy.angle = Math.round(ang);
  joy.power = Math.min(200, Math.round(20 + Math.max(0.2,d)*180));

  document.getElementById("dangle").textContent = joy.angle+"°";
  document.getElementById("dvel").textContent   = joy.power;
  drawJoy();
}

jcan.addEventListener("mousedown",  e=>{ if(st.phase!=="playing"||st.curP!==0)return; joy.active=true; const p=jPos(e); updateJoy(p.x,p.y); });
jcan.addEventListener("touchstart", e=>{ e.preventDefault(); if(st.phase!=="playing"||st.curP!==0)return; joy.active=true; const p=jPos(e); updateJoy(p.x,p.y); },{passive:false});
window.addEventListener("mousemove", e=>{ if(!joy.active)return; const p=jPos(e); updateJoy(p.x,p.y); });
window.addEventListener("touchmove", e=>{ if(!joy.active)return; const p=jPos(e); updateJoy(p.x,p.y); },{passive:false});
window.addEventListener("mouseup",  ()=>joy.active=false);
window.addEventListener("touchend", ()=>joy.active=false);
drawJoy();

/* ════════════════════════════════
   STATE
════════════════════════════════ */
const st = {
  phase:"setup",          // setup|playing|animating|roundover|gameover
  buildings:[], gorillas:[],
  wind:0, gravity:17,
  scores:[0,0], curP:0,
  round:1, totalRounds:5,
  names:["PLAYER","🤖 IA"],
  aiDiff:"medium",
  trajectory:[], trjIdx:0,
  hitResult:null, hitX:0, hitY:0,
  bananaAngle:0, explosion:null,
  sunMouth:"happy",
  groundY:480, sunX:400, sunY:60,
  // gorilla visual state per player
  gState:["idle","idle"],  // idle|ready|throw|dead
};

/* ── DOM ── */
const throwBtn  = document.getElementById("throwbtn");
const msgTxt    = document.getElementById("msgtxt");
const tdisp     = document.getElementById("tdisp");
const rnum      = document.getElementById("rnum");
const winSplash = document.getElementById("winsplash");
const winTitle  = document.getElementById("wintitle");
const winSub    = document.getElementById("winsub");
const winNext   = document.getElementById("winnextbtn");
const wFill     = document.getElementById("wfill");
const wVal      = document.getElementById("wval");
const aiBubble  = document.getElementById("aibubble");

/* ════════════════════════════════
   DRAW HELPERS
════════════════════════════════ */
function clear() {
  if(imgReady(SP.bg)){
    ctx.drawImage(SP.bg,0,0,canvas.width,canvas.height);
    ctx.fillStyle="rgba(0,0,20,.42)"; ctx.fillRect(0,0,canvas.width,canvas.height);
  } else {
    const g=ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,"#060618"); g.addColorStop(1,"#0a0a20");
    ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="rgba(255,255,255,.5)";
    [[50,30],[120,15],[200,45],[350,20],[480,35],[600,18],[720,40],
     [780,25],[90,80],[280,70],[430,55],[560,75],[660,50],[750,65]]
    .forEach(([sx,sy])=>{ctx.beginPath();ctx.arc(sx,sy,1,0,Math.PI*2);ctx.fill();});
  }
}

function drawGround(){
  const gy=st.groundY;
  ctx.fillStyle="#1a1a3a"; ctx.fillRect(0,gy,canvas.width,canvas.height-gy);
  ctx.strokeStyle="#2a2a5a"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke();
}

function drawBuildings(){
  st.buildings.forEach(b=>{
    ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle="rgba(255,255,255,.07)"; ctx.lineWidth=1; ctx.strokeRect(b.x,b.y,b.w,b.h);
    b.windows.forEach(w=>{
      ctx.fillStyle=w.lit?"#ffe070":"#111126";
      ctx.shadowColor=w.lit?"#ffe070":"transparent"; ctx.shadowBlur=w.lit?4:0;
      ctx.fillRect(w.x,w.y,w.w,w.h);
    });
    ctx.shadowBlur=0;
  });
}

function drawSun(mood){
  const sx=st.sunX, sy=st.sunY, r=22;
  ctx.shadowColor="#ffe600"; ctx.shadowBlur=30;
  ctx.fillStyle="#ffe600"; ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#ffe600"; ctx.lineWidth=2;
  [0,45,90,135,180,225,270,315].forEach(d=>{
    const rad=d*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(sx+Math.cos(rad)*(r+4),sy+Math.sin(rad)*(r+4));
    ctx.lineTo(sx+Math.cos(rad)*(r+12),sy+Math.sin(rad)*(r+12)); ctx.stroke();
  });
  ctx.shadowBlur=0;
  ctx.fillStyle="#1a0a00";
  ctx.beginPath(); ctx.arc(sx-7,sy-5,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+7,sy-5,2.5,0,Math.PI*2); ctx.fill();
  if(mood==="shocked"){
    ctx.beginPath(); ctx.arc(sx,sy+8,4,0,Math.PI*2); ctx.fill();
  } else {
    ctx.strokeStyle="#1a0a00"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy+2,10,.2,Math.PI-.2); ctx.stroke();
  }
}

/* gorilla canvas fallback */
function drawGorillaCanvas(gx,gy,state,pIdx){
  const col = pIdx===0?"#7a5c3a":"#5a3a2a";
  const hi  = pIdx===0?"#9a7a5a":"#7a5a3a";
  ctx.fillStyle=col;
  if(state==="dead"){
    ctx.fillRect(gx,gy+20,40,14); ctx.fillRect(gx+4,gy+14,14,10); return;
  }
  ctx.fillRect(gx+4,gy+12,22,20); ctx.fillRect(gx+5,gy,20,14);
  ctx.fillRect(gx+4,gy+30,9,10); ctx.fillRect(gx+17,gy+30,9,10);
  ctx.fillStyle=hi;
  if(state==="throw"){
    if(pIdx===0){ ctx.fillRect(gx-8,gy,12,6); ctx.fillRect(gx+26,gy+12,10,6); }
    else        { ctx.fillRect(gx+26,gy,12,6); ctx.fillRect(gx-8,gy+12,10,6); }
  } else if(state==="ready"){
    if(pIdx===0){ ctx.fillRect(gx-4,gy+2,12,6); ctx.fillRect(gx+26,gy+14,12,6); }
    else        { ctx.fillRect(gx+20,gy+2,12,6); ctx.fillRect(gx-8,gy+14,12,6); }
  } else {
    ctx.fillRect(gx-8,gy+14,12,6); ctx.fillRect(gx+26,gy+14,12,6);
  }
  ctx.fillStyle="#1a0a00";
  ctx.fillRect(gx+8,gy+3,5,2); ctx.fillRect(gx+17,gy+3,5,2);
  ctx.fillRect(gx+9,gy+8,12,2);
  ctx.fillStyle="rgba(255,255,255,.07)";
  ctx.beginPath(); ctx.arc(gx+15,gy+18,7,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=pIdx===0?"rgba(0,200,255,.5)":"rgba(255,60,90,.5)";
  ctx.lineWidth=1; ctx.shadowColor=pIdx===0?"#00c8ff":"#ff3c5a"; ctx.shadowBlur=8;
  ctx.strokeRect(gx+4,gy,22,40); ctx.shadowBlur=0;
}

function drawGorilla(gx,gy,gstate,pIdx){
  // Choose sprite based on state
  let img = null;
  if(pIdx===0){
    if(gstate==="idle")    img=SP.idle1;
    else if(gstate==="ready") img=SP.ready1;
    else if(gstate==="throw") img=SP.throw1;
    else if(gstate==="dead")  img=SP.dead1;
  } else {
    if(gstate==="throw")   img=SP.throw2;
    else                   img=SP.idle2;
  }
  if(imgReady(img)){
    ctx.drawImage(img,gx,gy,30,40);
  } else {
    drawGorillaCanvas(gx,gy,gstate,pIdx);
  }
}

function drawBanana(bx,by,angle){
  ctx.save(); ctx.translate(bx,by); ctx.rotate(angle);
  if(imgReady(SP.banana)){
    ctx.drawImage(SP.banana,-12,-12,24,24);
  } else {
    ctx.fillStyle="#ffe600"; ctx.shadowColor="#ffe600"; ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.arc(0,0,6,.5,Math.PI-.5); ctx.arc(0,-2,4.5,Math.PI+.3,-.3,true);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawExplosion(ex,ey,progress){
  if(imgReady(SP.exp)){
    const sz=Math.sin(progress*Math.PI)*80; if(sz<=0)return;
    ctx.save(); ctx.globalAlpha=Math.sin(progress*Math.PI);
    ctx.drawImage(SP.exp,ex-sz/2,ey-sz/2,sz,sz);
    ctx.globalAlpha=1; ctx.restore(); return;
  }
  const r=Math.sin(progress*Math.PI)*42; if(r<=0)return;
  [{r:r*1.2,c:"rgba(255,140,0,.3)"},{r:r*.9,c:"rgba(255,60,0,.5)"},
   {r:r*.6,c:"rgba(255,200,0,.7)"},{r:r*.3,c:"rgba(255,255,200,.9)"}]
  .forEach(l=>{
    ctx.beginPath(); ctx.arc(ex,ey,l.r,0,Math.PI*2);
    ctx.fillStyle=l.c; ctx.shadowColor="#ff8c00"; ctx.shadowBlur=22; ctx.fill();
  });
  ctx.shadowBlur=0;
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2, sr=r*(.8+Math.random()*.5);
    ctx.fillStyle=`rgba(255,${180+Math.random()*75|0},0,${.8-progress*.5})`;
    ctx.beginPath(); ctx.arc(ex+Math.cos(a)*sr,ey+Math.sin(a)*sr,2,0,Math.PI*2); ctx.fill();
  }
}

function drawWindIndicator(){
  const w=st.wind, norm=w/20;
  if(w===0){wFill.style.width="0";wFill.style.background="#888";}
  else if(w>0){wFill.style.left="50%";wFill.style.width=(Math.abs(norm)*50)+"%";wFill.style.background="linear-gradient(90deg,#ff8c00,#ffe600)";}
  else{const pct=Math.abs(norm)*50;wFill.style.left=(50-pct)+"%";wFill.style.width=pct+"%";wFill.style.background="linear-gradient(90deg,#00c8ff,#00ff9d)";}
  wVal.textContent=(w>0?"→":w<0?"←":"—")+" "+Math.abs(w);
}

function drawTrajectoryPreview(){
  if(st.curP!==0) return;
  const g=st.gorillas[0]; if(!g) return;
  const ang=joy.angle, vel=joy.power*.3;
  const rad=ang*Math.PI/180;
  ctx.setLineDash([4,8]); ctx.strokeStyle="rgba(0,200,255,.2)"; ctx.lineWidth=1;
  ctx.beginPath();
  const sx=g.x+15+10, sy=g.y+5; let drawn=false;
  for(let t=0;t<4;t+=.12){
    const vx=Math.cos(rad)*vel, vy=Math.sin(rad)*vel;
    const x=sx+vx*t, y=sy-(vy*t-.5*9.8*t*t);
    if(!drawn){ctx.moveTo(x,y);drawn=true;}else ctx.lineTo(x,y);
    if(y>canvas.height||x<-20||x>canvas.width+20)break;
  }
  ctx.stroke(); ctx.setLineDash([]);

  // Arrow + angle label
  const arlen=40;
  ctx.strokeStyle="rgba(0,230,255,.65)"; ctx.lineWidth=2;
  ctx.shadowColor="#00c8ff"; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.moveTo(sx,sy);
  ctx.lineTo(sx+Math.cos(rad)*arlen, sy-Math.sin(rad)*arlen); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle="#ffe600"; ctx.font="bold 11px Orbitron,monospace";
  ctx.fillText(ang+"°", sx+6, sy-16);
}

function renderFrame(){
  clear(); drawGround(); drawBuildings(); drawSun(st.sunMouth);
  st.gorillas.forEach((g,i)=>{ drawGorilla(g.x,g.y,st.gState[i],i); });
  if(st.phase==="playing") drawTrajectoryPreview();
  if(st.phase==="animating"&&st.trajectory.length>0){
    const pt=st.trajectory[Math.min(st.trjIdx,st.trajectory.length-1)];
    st.bananaAngle+=.25;
    drawBanana(pt.x,pt.y,st.bananaAngle);
  }
  if(st.explosion) drawExplosion(st.explosion.x,st.explosion.y,st.explosion.progress);
}

/* ════════════════════════════════
   ANIMATION LOOP  (banana lenta)
════════════════════════════════ */
let raf=null;
function startLoop(){
  function loop(){
    renderFrame();
    if(st.phase==="animating"){
      st.trjIdx+=1;
      if(st.trjIdx>=st.trajectory.length){
        if(st.hitResult&&st.hitResult.startsWith("gorilla")){
          st.sunMouth="shocked";
          st.explosion={x:st.hitX,y:st.hitY,progress:0};
        } else finishThrow(false);
      }
    }
    if(st.explosion){
      st.explosion.progress+=.03;
      if(st.explosion.progress>=1){ st.explosion=null; finishThrow(true); }
    }
    raf=requestAnimationFrame(loop);
  }
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

/* ════════════════════════════════
   GAME LOGIC
════════════════════════════════ */
async function startNewGame(){
  st.names[0] = document.getElementById("p1name").value.trim().toUpperCase()||"PLAYER";
  st.names[1] = "🤖 IA";
  st.aiDiff   = document.getElementById("aiDiff").value;
  st.gravity  = parseInt(document.getElementById("gravInput").value)||17;
  st.totalRounds = parseInt(document.getElementById("roundsInput").value)||5;
  st.scores=[0,0]; st.round=1;
  document.getElementById("hup1").textContent=st.names[0];
  document.getElementById("hup2").textContent=st.names[1];
  updateScoreHUD(); await loadRound();
}

async function loadRound(){
  st.phase="animating"; throwBtn.disabled=true;
  st.gState=["idle","idle"];
  const res=await fetch("/api/new_game",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({gravity:st.gravity})});
  const d=await res.json();
  st.buildings=d.buildings; st.gorillas=d.gorillas; st.wind=d.wind;
  st.gravity=d.gravity; st.groundY=d.ground_y;
  st.sunX=d.sun.x; st.sunY=d.sun.y;
  st.curP=0; st.trajectory=[]; st.trjIdx=0;
  st.hitResult=null; st.explosion=null; st.sunMouth="happy";
  drawWindIndicator(); updateTurnHUD();
  rnum.textContent=st.round;
  st.phase="playing"; throwBtn.disabled=false;
  showMsg(`🍌 Rodada ${st.round} — SUA VEZ, ${st.names[0]}!`);
}

async function doThrow(angle,velocity){
  if(st.phase!=="playing") return;
  st.phase="animating"; throwBtn.disabled=true;
  const p=st.curP, g=st.gorillas[p];

  // Animate gorilla state: ready → throw
  st.gState[p]="ready";
  await delay(350);
  st.gState[p]="throw";

  const res=await fetch("/api/throw",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({gorilla_x:g.x+15,gorilla_y:g.y+5,angle,velocity,
      player:p+1,buildings:st.buildings,gorillas:st.gorillas,gravity:st.gravity,wind:st.wind}),
  });
  const d=await res.json();
  st.trajectory=d.points; st.trjIdx=0;
  st.hitResult=d.hit; st.hitX=d.hit_x; st.hitY=d.hit_y;
  st.bananaAngle=0;
  if(d.message) showMsg(d.message);
}

function finishThrow(wasHit){
  st.sunMouth="happy";

  if(wasHit&&st.hitResult&&st.hitResult.startsWith("gorilla")){
    const hitIdx=parseInt(st.hitResult.replace("gorilla",""))-1;
    const scorer=hitIdx===st.curP?(1-st.curP):st.curP;
    // Mark dead gorilla
    st.gState[hitIdx]="dead";
    st.scores[scorer]++;
    updateScoreHUD();

    const max=Math.ceil(st.totalRounds/2)+1;
    if(st.scores[scorer]>=max||st.round>=st.totalRounds){
      showWin(scorer,false); st.phase="gameover"; return;
    }
    st.round++;
    showWin(scorer,true); st.phase="roundover";
  } else {
    // Reset throw state
    st.gState[st.curP]="idle";
    st.curP=1-st.curP;
    updateTurnHUD();
    st.phase="playing";

    if(st.curP===1){
      // AI turn
      throwBtn.disabled=true;
      showMsg("🤖 IA pensando...");
      aiBubble.textContent="🤖 Calculando...";
      aiBubble.style.display="block";

      setTimeout(async()=>{
        try{
          const res=await fetch("/api/ai_throw",{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
              gorillas:st.gorillas, buildings:st.buildings,
              wind:st.wind, gravity:st.gravity, difficulty:st.aiDiff,
            }),
          });
          const d=await res.json();
          const comment=d.comment||"";
          aiBubble.textContent="🤖 "+(comment||`Ângulo ${d.angle}° | Vel ${d.velocity}`);
          if(comment) showMsg(`🤖 "${comment}"`);
          else showMsg(`🤖 IA lança — ângulo ${d.angle}°, velocidade ${d.velocity}`);

          await delay(700);
          aiBubble.style.display="none";
          await doThrow(d.angle,d.velocity);
        }catch(e){
          aiBubble.style.display="none";
          console.error("AI throw error",e);
          // Fallback local
          const angle=Math.round(100+Math.random()*60);
          const velocity=Math.round(60+Math.random()*80);
          await doThrow(angle,velocity);
        }
      }, 800+Math.random()*600);
    } else {
      throwBtn.disabled=false;
      showMsg(`🎯 ${st.names[0]}, é sua vez!`);
    }
  }
}

function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

function showWin(winner,roundOnly){
  const n=st.names[winner];
  if(roundOnly){
    winTitle.textContent=`🎉 ${n} VENCEU A RODADA!`;
    winSub.textContent=`Placar: ${st.scores[0]} × ${st.scores[1]} — Clique para continuar`;
    winNext.textContent="PRÓXIMA RODADA ▶";
  } else {
    winTitle.textContent=`🏆 ${n} CAMPEÃO!`;
    winSub.textContent=`Placar final: ${st.scores[0]} × ${st.scores[1]}`;
    winNext.textContent="NOVA PARTIDA ▶";
  }
  winSplash.classList.add("show");
}

winNext.addEventListener("click",()=>{
  winSplash.classList.remove("show");
  if(st.phase==="gameover") openSetup();
  else loadRound();
});

function updateScoreHUD(){
  document.getElementById("sc1").textContent=st.scores[0];
  document.getElementById("sc2").textContent=st.scores[1];
}
function updateTurnHUD(){
  tdisp.textContent=st.names[st.curP];
  tdisp.style.color=st.curP===0?"var(--p1)":"var(--p2)";
}
function showMsg(txt){ msgTxt.textContent=txt; }

/* ════════════════════════════════
   SETUP MODAL
════════════════════════════════ */
function openSetup(){
  document.getElementById("setupmodal").style.display="flex";
  document.getElementById("overlay").style.display="block";
}
function closeSetup(){
  document.getElementById("setupmodal").style.display="none";
  document.getElementById("overlay").style.display="none";
}
document.getElementById("playbtn").addEventListener("click",async()=>{ closeSetup(); await startNewGame(); });
document.getElementById("settingsbtn").addEventListener("click",openSetup);
document.getElementById("newgamebtn").addEventListener("click",async()=>{ winSplash.classList.remove("show"); await startNewGame(); });

/* ════════════════════════════════
   THROW BUTTON + KEYBOARD
════════════════════════════════ */
throwBtn.addEventListener("click",()=>{ if(st.phase!=="playing"||st.curP!==0)return; doThrow(joy.angle,joy.power); });
document.addEventListener("keydown",e=>{
  if(st.phase!=="playing"||st.curP!==0)return;
  if(e.key==="Enter"||e.key===" ") doThrow(joy.angle,joy.power);
  if(e.key==="ArrowLeft")  joy.angle=Math.max(0,  joy.angle-1);
  if(e.key==="ArrowRight") joy.angle=Math.min(180,joy.angle+1);
  if(e.key==="ArrowUp")    joy.power=Math.min(200,joy.power+2);
  if(e.key==="ArrowDown")  joy.power=Math.max(10, joy.power-2);
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){
    document.getElementById("dangle").textContent=joy.angle+"°";
    document.getElementById("dvel").textContent=joy.power;
    drawJoy();
  }
});

/* Responsive canvas */
function resizeCanvas(){
  const w=Math.min(window.innerWidth-24,860);
  canvas.style.width=w+"px";
  canvas.style.height=Math.round(500*(w/800))+"px";
}
window.addEventListener("resize",resizeCanvas); resizeCanvas();

/* ── INIT ── */
startLoop(); drawJoy();
</script>
